[project]
name = "rag-law"
version = "0.1.0"
description = "RAG system for Vietnamese Laws & Codes (UTS_VLC corpus)"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_law"]

[tool.pytest.ini_options]
testpaths = ["tests"]
